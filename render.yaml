# Render Blueprint — backend only (FastAPI + PostgreSQL).
# The frontend (frontend/) deploys to Vercel; see DEPLOYMENT.md.
#
# Render reads this file from the repo root when you create a Blueprint.
# It provisions one web service. The database is NOT managed by Render — it's
# an external Neon PostgreSQL instance (permanent free tier), provisioned
# separately.
#
# Secrets are NOT in this file. DATABASE_URL, JWT_SECRET and CORS_ALLOW_ORIGINS
# are marked `sync: false`, which tells Render to show them as empty fields in
# the dashboard on the first deploy, to be filled in by hand, and never read
# from source control.

services:
  - type: web
    name: expense-splitting-api
    # Built from the repo's ./Dockerfile — the same image `docker compose` runs
    # locally. Switched from `runtime: python` in place: Render supports
    # changing an existing service's runtime by editing this field and syncing
    # the Blueprint (the dashboard can't do it). See DEPLOYMENT.md, "Rolling
    # back to the native Python runtime".
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free # free web services cold-start after ~15 min idle; see DEPLOYMENT.md
    region: singapore # closest Render region to Thailand; change if you prefer
    branch: main
    healthCheckPath: /health

    # No buildCommand/startCommand/dockerCommand: a Docker service builds from
    # the Dockerfile and runs its ENTRYPOINT + CMD. Migrations run in exactly
    # one place — docker-entrypoint.sh runs `alembic upgrade head` on every
    # container start, then execs uvicorn on Render's injected $PORT. Don't add
    # a migration here as well (and don't set dockerCommand, which would replace
    # the CMD). `preDeployCommand` is paid-plan only; on free it is skipped.

    envVars:
      # Pin the interpreter Render builds against (uv.lock targets 3.12).
      - key: PYTHON_VERSION
        value: "3.12.6"

      # Paste the Neon connection string in the dashboard on first deploy.
      # Neon gives a postgresql:// URL with ?sslmode=require — keep the query
      # string; app/database.py rewrites the scheme to psycopg and leaves the
      # rest intact.
      - key: DATABASE_URL
        sync: false

      # Prompted for in the dashboard on first deploy, never committed.
      # Generate with:  python -c "import secrets; print(secrets.token_urlsafe(32))"
      - key: JWT_SECRET
        sync: false

      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"

      # Set this to the deployed Vercel URL AFTER the frontend exists
      # (DEPLOYMENT.md, Part 3). Comma-separated, exact origins, no trailing
      # slash. Leaving it blank is fine until then — the API just won't send
      # CORS headers yet.
      - key: CORS_ALLOW_ORIGINS
        sync: false
