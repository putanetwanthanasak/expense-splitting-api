[project]
name = "expense-splitting-api"
version = "0.1.0"
description = "Group expense-sharing API (Splitwise-style) — backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "passlib[bcrypt]>=1.7",
    # passlib 1.7.4 (last released 2020, unmaintained) probes the bcrypt backend in
    # a way that raises ValueError on bcrypt>=4.1 — pin below that until passlib
    # ships a fix. See https://github.com/pyca/bcrypt/issues/684.
    "bcrypt<4.1",
    "python-multipart>=0.0.9",
    "email-validator>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-randomly>=3.15",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "hypothesis>=6.111",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = "passlib.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
